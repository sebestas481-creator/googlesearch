<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jednoduché rozhraní pro Vyhledávání Google.">
    <title>Vyhledávání Google</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="top-bar">
      <a href="images.html">Obrázky</a>
      <a href="advanced.html">Rozšířené vyhledávání</a>
      <a href="forms.html">Formuláře</a>
      <a class="portfolio-link" href="https://github.com/sebestas481-creator" target="_blank" rel="noopener noreferrer">Portfolio</a>
    </header>

    <main class="home-main">
      <h1 class="brand" aria-label="Google">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </h1>
      <form class="search-form" action="https://www.google.com/search" method="get">
        <div class="search-box">
          <input type="search" name="q" aria-label="Hledaný výraz" title="Zadejte hledaný výraz" autocomplete="off" required>
        </div>
        <div class="search-actions">
          <button class="search-button" type="submit" name="btnK" value="Vyhledávání Google">Vyhledávání Google</button>
          <button class="search-button" type="submit" name="btnI" value="I'm Feeling Lucky">Zkusím štěstí</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fraw.githubusercontent.com%2Fsebestas481-creator%2Fgooglesearch%2Fmain%2Findex.html" target="_blank" rel="noopener noreferrer">Validace HTML</a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fraw.githubusercontent.com%2Fsebestas481-creator%2Fgooglesearch%2Fmain%2Fstyles.css&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;vextwarning=&amp;lang=cs" target="_blank" rel="noopener noreferrer">Validace CSS</a>
      <a href="https://github.com/sebestas481-creator/googlesearch/blob/main/citace.md" target="_blank" rel="noopener noreferrer">Citace a zdroje</a>
      <a href="https://github.com/sebestas481-creator" target="_blank" rel="noopener noreferrer">Portfolio</a>
    </footer>
  </body>
</html>
